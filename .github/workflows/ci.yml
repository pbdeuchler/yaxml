name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.95.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  fuzz-smoke-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-06-06
          components: llvm-tools-preview
      - name: Replay and mutate corpus with source coverage
        shell: bash
        env:
          RUSTFLAGS: -C instrument-coverage -Z coverage-options=branch
          CARGO_TARGET_DIR: target/fuzz-coverage-build
          LLVM_PROFILE_FILE: target/fuzz-coverage/%p-%m.profraw
        run: |
          mkdir -p target/fuzz-coverage
          cargo test --test fuzz_smoke --no-run --message-format=json > target/fuzz-coverage/artifacts.jsonl
          cargo test --test fuzz_smoke
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          "$llvm_bin/llvm-profdata" merge -sparse target/fuzz-coverage/*.profraw -o target/fuzz-coverage/merged.profdata
          binary="$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' target/fuzz-coverage/artifacts.jsonl)"
          "$llvm_bin/llvm-cov" report "$binary" --instr-profile=target/fuzz-coverage/merged.profdata --ignore-filename-regex='(/\.cargo/|/rustc/|/tests/|/fuzz/|/examples/)' > target/fuzz-coverage/library-report.txt
          "$llvm_bin/llvm-cov" export "$binary" --instr-profile=target/fuzz-coverage/merged.profdata > target/fuzz-coverage/coverage.json
          rustc -vV > target/fuzz-coverage/compiler.txt
          git rev-parse HEAD > target/fuzz-coverage/revision.txt
          cat target/fuzz-coverage/library-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-coverage
          path: target/fuzz-coverage/

  libxml2-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Build the pinned external oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/oracle
          curl --fail --location --retry 3 --max-time 120 \
            https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz \
            --output target/oracle/libxml2-2.15.4.tar.xz
          echo '98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821  target/oracle/libxml2-2.15.4.tar.xz' | sha256sum --check
          tar -xJf target/oracle/libxml2-2.15.4.tar.xz -C target/oracle
          cmake -S target/oracle/libxml2-2.15.4 -B target/oracle/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLIBXML2_WITH_ICONV=OFF -DLIBXML2_WITH_ISO8859X=OFF \
            -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_ZLIB=OFF \
            -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_DOCS=OFF \
            -DLIBXML2_WITH_TESTS=OFF -DLIBXML2_WITH_PROGRAMS=ON \
            -DLIBXML2_WITH_XPATH=ON -DLIBXML2_WITH_OUTPUT=ON
          cmake --build target/oracle/build --target xmllint --parallel 2
          cc -std=c11 -Wall -Wextra -Werror \
            -Itarget/oracle/build -Itarget/oracle/libxml2-2.15.4/include \
            tooling/libxml2_structure.c target/oracle/build/libxml2.a \
            -lm -pthread -ldl -o target/oracle/structure-helper
          cc -std=c11 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic \
            -Itarget/oracle/build -Itarget/oracle/libxml2-2.15.4/include \
            tooling/libxml2_structure_bench.c target/oracle/build/libxml2.a \
            -lm -pthread -ldl -o target/oracle/structure-bench-helper
          target/oracle/build/xmllint --version > target/oracle/version.txt 2>&1
          target/oracle/structure-helper --version > target/oracle/structure-version.txt
          cc --version > target/oracle/c-compiler.txt
          cmake -LA -N target/oracle/build > target/oracle/build-options.txt
      - name: Compare acceptance and independent infosets
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV > target/oracle/compiler.txt
          git rev-parse HEAD > target/oracle/revision.txt
          sha256sum fuzz/corpus/* > target/oracle/corpus-sha256.txt
          cargo run --release --example fuzz_replay -- \
            --libxml2 "$PWD/target/oracle/build/xmllint" fuzz/corpus/* \
            2>&1 | tee target/oracle/comparison.txt
      - name: Compare leaf insertion and permanent removal
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tooling/libxml2_structure.c examples/support/structure.rs \
            > target/oracle/structure-source-sha256.txt
          cargo run --release --example structure_oracle -- \
            --libxml2-helper "$PWD/target/oracle/structure-helper" \
            2>&1 | tee target/oracle/structure-comparison.txt
      - name: Run the complete pinned XML conformance catalog
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Itarget/oracle/build -Itarget/oracle/libxml2-2.15.4/include \
            tooling/libxml2_xmlconf_catalog.c target/oracle/build/libxml2.a \
            -lm -pthread -ldl -o target/oracle/xmlconf-catalog-helper
          target/oracle/xmlconf-catalog-helper --version > target/oracle/xmlconf-helper-version.txt
          YAXML_XMLCONF_HELPER="$PWD/target/oracle/xmlconf-catalog-helper" \
            cargo test --test xml_conformance_catalog_cli -- --ignored
          curl --fail --location --retry 3 --max-time 120 --max-filesize 8388608 \
            https://www.w3.org/XML/Test/xmlts20130923.tar.gz \
            --output target/oracle/xmlts20130923.tar.gz
          echo '9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f  target/oracle/xmlts20130923.tar.gz' \
            | sha256sum --check
          mkdir -p target/oracle/xml-suite
          tar -xzf target/oracle/xmlts20130923.tar.gz -C target/oracle/xml-suite
          XML_CATALOG_FILES= SGML_CATALOG_FILES= target/oracle/xmlconf-catalog-helper \
            "$PWD/target/oracle/xml-suite/xmlconf/xmlconf.xml" \
            "$PWD/target/oracle/xml-suite/xmlconf" > target/oracle/xmlconf-catalog.tsv \
            2> target/oracle/xmlconf-catalog.stderr
          test ! -s target/oracle/xmlconf-catalog.stderr
          test "$(wc -l < target/oracle/xmlconf-catalog.tsv)" -eq 2586
          find target/oracle/xml-suite/xmlconf -type f -print0 \
            | sort -z | xargs -0 sha256sum > target/oracle/xmlconf-input-sha256.txt
          cargo build --release --example xml_conformance
          cp tests/fixtures/xmlconf-20130923-required.tsv target/oracle/xmlconf-required-pass.tsv
          sha256sum target/release/examples/xml_conformance target/oracle/xmlconf-catalog-helper \
            target/oracle/build/libxml2.a > target/oracle/xmlconf-binary-sha256-start.txt
          target/release/examples/xml_conformance \
            --manifest target/oracle/xmlconf-catalog.tsv \
            --suite-root target/oracle/xml-suite/xmlconf --expected-cases 2585 \
            --required-pass tests/fixtures/xmlconf-20130923-required.tsv \
            > target/oracle/xmlconf-results.tsv 2> target/oracle/xmlconf-results.stderr
          find target/oracle/xml-suite/xmlconf -type f -print0 \
            | sort -z | xargs -0 sha256sum > target/oracle/xmlconf-input-sha256-end.txt
          cmp target/oracle/xmlconf-input-sha256.txt target/oracle/xmlconf-input-sha256-end.txt
          sha256sum target/release/examples/xml_conformance target/oracle/xmlconf-catalog-helper \
            target/oracle/build/libxml2.a > target/oracle/xmlconf-binary-sha256-end.txt
          cmp target/oracle/xmlconf-binary-sha256-start.txt target/oracle/xmlconf-binary-sha256-end.txt
          sha256sum tooling/libxml2_xmlconf_catalog.c examples/xml_conformance.rs \
            examples/support/conformance_catalog.rs examples/support/conformance_worker.rs \
            tests/fixtures/xmlconf-20130923-required.tsv \
            target/oracle/xmlconf-catalog.tsv target/oracle/xmlconf-results.tsv \
            > target/oracle/xmlconf-artifact-sha256.txt
          cat target/oracle/xmlconf-results.stderr
      - name: Check matched DOM and streaming parsing helpers
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic -Wconversion -Wshadow \
            -Itarget/oracle/build -Itarget/oracle/libxml2-2.15.4/include \
            tooling/libxml2_parse_bench.c target/oracle/build/libxml2.a \
            -lm -pthread -ldl -o target/oracle/parse-bench-helper
          target/oracle/parse-bench-helper --version > target/oracle/parse-bench-version.txt
          YAXML_PARSE_LIBXML2_HELPER="$PWD/target/oracle/parse-bench-helper" \
            cargo test --test parse_benchmark_cli -- --ignored
          cargo build --release --example parse_bench --example parse_benchmark
          : > target/oracle/parse-benchmark-smoke.txt
          for mode in dom owned reader push buffered; do
            target/release/examples/parse_benchmark \
              --libxml2-helper "$PWD/target/oracle/parse-bench-helper" \
              --yaxml-helper "$PWD/target/release/examples/parse_bench" \
              --fixture mixed --mode "$mode" --iterations 1 --samples 1 --chunk-size 7 \
              >> target/oracle/parse-benchmark-smoke.txt
          done
          sha256sum tooling/libxml2_parse_bench.c examples/parse_bench.rs \
            examples/parse_benchmark.rs examples/support/parse_observer.rs \
            examples/support/parse_benchmark.rs examples/support/process.rs \
            target/oracle/parse-bench-helper target/oracle/build/libxml2.a \
            target/release/examples/parse_bench target/release/examples/parse_benchmark \
            > target/oracle/parse-benchmark-sha256.txt
      - name: Smoke matched structural editing phases
        shell: bash
        run: |
          set -euo pipefail
          cargo bench --bench structural_mutation --no-run --message-format=json \
            > target/oracle/structure-benchmark-artifacts.jsonl
          yaxml_bench="$(jq -r 'select(.target.name == "structural_mutation" and .executable != null) | .executable' \
            target/oracle/structure-benchmark-artifacts.jsonl | tail -n 1)"
          test -x "$yaxml_bench"
          : > target/oracle/structure-benchmark-smoke.txt
          for case_name in append_text append_cdata append_comment append_pi \
                           remove_first remove_middle remove_last remove_deep churn; do
            cargo run --release --example structure_benchmark -- \
              --libxml2-helper "$PWD/target/oracle/structure-bench-helper" \
              --yaxml-helper "$yaxml_bench" \
              --samples 1 --case "$case_name" --encoding utf8 \
              --width 4 --depth 4 --payload-bytes 8 \
              --iterations 1 --operations 4 \
              --traversal-passes 1 --serialization-passes 1 \
              >> target/oracle/structure-benchmark-smoke.txt
          done
          sha256sum tooling/libxml2_structure_bench.c \
            benches/structural_mutation.rs \
            examples/support/structure_benchmark.rs \
            > target/oracle/structure-benchmark-source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libxml2-oracle
          path: |
            target/oracle/version.txt
            target/oracle/build-options.txt
            target/oracle/comparison.txt
            target/oracle/compiler.txt
            target/oracle/revision.txt
            target/oracle/corpus-sha256.txt
            target/oracle/structure-version.txt
            target/oracle/structure-comparison.txt
            target/oracle/structure-source-sha256.txt
            target/oracle/structure-benchmark-smoke.txt
            target/oracle/structure-benchmark-source-sha256.txt
            target/oracle/c-compiler.txt
            target/oracle/xmlconf-helper-version.txt
            target/oracle/xmlconf-catalog.tsv
            target/oracle/xmlconf-catalog.stderr
            target/oracle/xmlconf-results.tsv
            target/oracle/xmlconf-results.stderr
            target/oracle/xmlconf-input-sha256.txt
            target/oracle/xmlconf-input-sha256-end.txt
            target/oracle/xmlconf-artifact-sha256.txt
            target/oracle/xmlconf-required-pass.tsv
            target/oracle/xmlconf-binary-sha256-start.txt
            target/oracle/xmlconf-binary-sha256-end.txt
            target/oracle/parse-bench-version.txt
            target/oracle/parse-benchmark-smoke.txt
            target/oracle/parse-benchmark-sha256.txt

[package]
name = "yaxml-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
yaxml = { path = ".." }

# Standalone workspace: the library's dependency graph stays memchr-only.

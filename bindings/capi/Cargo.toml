[package]
name = "yaxml-capi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "C ABI for yaxml (yaxml-specific, not libxml2 symbol-compatible)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "yaxml_capi"
# rlib: the fuzz target and the Rust tests call the exported functions directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
yaxml = { path = "../.." }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

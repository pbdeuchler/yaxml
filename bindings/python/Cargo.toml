[package]
name = "yaxml-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Python bindings (lxml.etree-style) for yaxml"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_yaxml"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
yaxml = { path = "../.." }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Standalone workspace: the core crate's dependency graph and lockfile never see pyo3.
[workspace]

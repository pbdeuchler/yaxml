[package]
name = "yaxml"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A safe Rust XML processor pursuing libxml2 compatibility"
license = "MIT OR Apache-2.0"

[dependencies]
memchr = "2.8.0"

[features]
default = []

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "pull"
harness = false

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "structural_mutation"
harness = false

[[bench]]
name = "regexp"
harness = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

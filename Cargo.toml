[package]
name = "yaxml"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A safe Rust XML processor pursuing libxml2 compatibility"
license = "MIT OR Apache-2.0"
# Language bindings are their own workspace (bindings/Cargo.toml).
exclude = ["/bindings"]

[dependencies]
memchr = "2.8.0"

[features]
default = []
# Allocator-aware OwnedDocument storage; requires Rust 1.100 (std allocator API).
allocator_api = []

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "pull"
harness = false

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "structural_mutation"
harness = false

[[bench]]
name = "regexp"
harness = false

[[bench]]
name = "valid"
harness = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
